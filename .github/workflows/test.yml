name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # the tests have no dependencies: elf2image (SHA-256, layout; the native comparison runs only if the reference ELF is present),
      # the pack-selection logic and the .ino preprocessing
      - run: npm test
