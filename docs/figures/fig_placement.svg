<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<rect width="1200" height="520" fill="#FFFFFF"/>
<text x="48" y="56" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1F2A44" text-anchor="start">The linker places code by library and file name</text>
<text x="48" y="104" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#2B7A78" text-anchor="start">Keep the .a files separate (what I chose)</text>
<rect x="48" y="136" width="288" height="48" rx="8" ry="8" fill="#FFFFFF" stroke="#2B7A78" stroke-width="2"/>
<text x="192" y="166" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1F2A44" text-anchor="middle">libspi_flash.a : spi_flash.*</text>
<rect x="48" y="200" width="288" height="48" rx="8" ry="8" fill="#FFFFFF" stroke="#2B7A78" stroke-width="2"/>
<text x="192" y="230" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1F2A44" text-anchor="middle">libapp_trace.a : app_trace.*</text>
<rect x="48" y="264" width="288" height="48" rx="8" ry="8" fill="#FFFFFF" stroke="#2B7A78" stroke-width="2"/>
<text x="192" y="294" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1F2A44" text-anchor="middle">libfreertos.a : tasks.*</text>
<line x1="336" y1="232" x2="416" y2="232" stroke="#2B7A78" stroke-width="2" stroke-linecap="round"/>
<polygon points="424,232 416,227 416,237" fill="#2B7A78"/>
<rect x="432" y="168" width="136" height="128" rx="8" ry="8" fill="#E8F2F1" stroke="#2B7A78" stroke-width="2"/>
<text x="500" y="224" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1F2A44" text-anchor="middle">IRAM</text>
<text x="500" y="248" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle">fast internal</text>
<text x="500" y="268" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle">memory</text>
<text x="48" y="336" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="start">352 rules match these names</text>
<rect x="48" y="352" width="296" height="32" rx="16" ry="16" fill="#E8F2F1" stroke="#2B7A78" stroke-width="2"/>
<g transform="translate(60,356)" fill="none" stroke="#2B7A78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="5,12 10,17 19,7"/></g>
<text x="92" y="373" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2B7A78" text-anchor="start">works while flash is busy</text>
<text x="632" y="104" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2A44" text-anchor="start">Merge everything with ld -r</text>
<rect x="632" y="136" width="240" height="176" rx="8" ry="8" fill="#F1F5F9" stroke="#64748B" stroke-width="2" stroke-dasharray="6 6"/>
<text x="752" y="208" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2A44" text-anchor="middle">one big object</text>
<text x="752" y="240" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle">file names are gone</text>
<text x="752" y="264" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle">no rule can match</text>
<line x1="872" y1="224" x2="944" y2="224" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
<polygon points="952,224 944,219 944,229" fill="#64748B"/>
<rect x="960" y="176" width="192" height="96" rx="8" ry="8" fill="#FFFFFF" stroke="#64748B" stroke-width="2" stroke-dasharray="6 6"/>
<text x="1056" y="220" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1F2A44" text-anchor="middle">flash</text>
<text x="1056" y="244" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle">wrong place</text>
<rect x="632" y="352" width="296" height="32" rx="16" ry="16" fill="#FFFFFF" stroke="#64748B" stroke-width="2" stroke-dasharray="6 6"/>
<g transform="translate(644,356)" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></g>
<text x="676" y="373" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#64748B" text-anchor="start">crashes when flash is busy</text>
<line x1="48" y1="416" x2="1152" y2="416" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
<text x="48" y="456" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2A44" text-anchor="start">Decision D2: keep every SDK library as its own .a file.</text>
<text x="48" y="488" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="start">The S3 SDK is 168 libraries (226 MB). The linker script has 352 placement rules, 69 of them for libspi_flash.a alone.</text>
</svg>
