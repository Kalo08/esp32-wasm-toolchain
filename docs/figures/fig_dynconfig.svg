<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="544" viewBox="0 0 1200 544">
<rect width="1200" height="544" fill="#FFFFFF"/>
<text x="48" y="56" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1F2A44" text-anchor="start">Native tools</text>
<rect x="48" y="88" width="520" height="96" rx="8" ry="8" fill="#FFFFFF" stroke="#1F2A44" stroke-width="2"/>
<text x="308" y="128" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1F2A44" text-anchor="middle">as / ld / cc1plus</text>
<text x="308" y="156" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle">needs to know the S3 instruction set</text>
<line x1="308" y1="184" x2="308" y2="264" stroke="#1F2A44" stroke-width="2" stroke-linecap="round"/>
<polygon points="308,272 303,264 313,264" fill="#1F2A44"/>
<text x="332" y="234" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="start">loads at run time</text>
<rect x="48" y="272" width="520" height="96" rx="8" ry="8" fill="#FFFFFF" stroke="#64748B" stroke-width="2" stroke-dasharray="6 6"/>
<text x="308" y="312" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1F2A44" text-anchor="middle">xtensa_esp32s3.so</text>
<text x="308" y="340" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle">a 0.9 MB shared library next to the tool</text>
<rect x="160" y="400" width="296" height="32" rx="16" ry="16" fill="#FFFFFF" stroke="#64748B" stroke-width="2" stroke-dasharray="6 6"/>
<g transform="translate(172,404)" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></g>
<text x="204" y="421" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#64748B" text-anchor="start">WebAssembly cannot do this</text>
<text x="632" y="56" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#4A6B5D" text-anchor="start">My WebAssembly tools</text>
<rect x="632" y="88" width="520" height="96" rx="8" ry="8" fill="#FFFFFF" stroke="#4A6B5D" stroke-width="2"/>
<text x="892" y="128" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1F2A44" text-anchor="middle">as / ld / cc1plus</text>
<text x="892" y="156" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle">needs to know the S3 instruction set</text>
<line x1="892" y1="272" x2="892" y2="192" stroke="#4A6B5D" stroke-width="2" stroke-linecap="round"/>
<polygon points="892,184 887,192 897,192" fill="#4A6B5D"/>
<text x="916" y="234" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="start">already inside</text>
<rect x="632" y="272" width="520" height="96" rx="8" ry="8" fill="#EAF0ED" stroke="#4A6B5D" stroke-width="2"/>
<text x="892" y="312" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#1F2A44" text-anchor="middle">two files swapped in before building</text>
<text x="892" y="340" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle">xtensa-modules.c  +  xtensa-config.h</text>
<rect x="744" y="400" width="296" height="32" rx="16" ry="16" fill="#EAF0ED" stroke="#4A6B5D" stroke-width="2"/>
<g transform="translate(756,404)" fill="none" stroke="#4A6B5D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="5,12 10,17 19,7"/></g>
<text x="788" y="421" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A6B5D" text-anchor="start">no library, no dlopen</text>
<line x1="48" y1="464" x2="1152" y2="464" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
<text x="48" y="496" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="start">With XTENSA_GNU_CONFIG unset the loader returns a compiled-in default, so the S3 definition becomes that default.</text>
<text x="48" y="520" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="start">The S3 file is 43,686 lines against 20,896 for the default chip.</text>
</svg>
